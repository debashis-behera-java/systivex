name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # The full suite uses Testcontainers PostgreSQL; the GitHub-hosted Ubuntu
      # runner provides a Docker daemon, so no extra service configuration is needed.
      - name: Run backend test suite
        run: ./mvnw -B clean test
