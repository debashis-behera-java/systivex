# Systivex example configuration — safe to commit. Contains no secrets.
#
# Local use: copy this file to `application.properties` in the same directory
# and adjust locally. The live `application.properties` is git-ignored
# (see root .gitignore) and must never be committed.
spring.application.name=systivex

# --- Phase 4: localhost-only development boundary ---
# The control plane (including the twin API and the POST /api/v1/twin/sync
# trigger) binds to the loopback interface by default. The sync endpoint
# additionally refuses non-loopback peers at the application layer. Do not
# change this to 0.0.0.0 without an authentication story and a recorded
# security review (see THREAT_MODEL.md).
server.address=127.0.0.1

# --- Phase 1: PostgreSQL + Flyway + JPA ---
# Point the URL/username at your local database. The password always comes
# from the environment (SYSTIVEX_DB_PASSWORD) — never write it into the
# local properties file either if you can avoid it.
# Windows PowerShell for the current session:
#   $env:SYSTIVEX_DB_PASSWORD="<your local systivex_app password>"
spring.datasource.url=jdbc:postgresql://localhost:5432/systivex
spring.datasource.username=systivex_app
spring.datasource.password=${SYSTIVEX_DB_PASSWORD:}

# Flyway is the schema authority; Hibernate only validates the migrated schema.
# Never use update/create/create-drop here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Phase 3A: observability (metrics + tracing + correlated logs) ---
# Health plus a Prometheus-compatible scrape endpoint; the control plane
# emits traces but nothing consumes or stores them here yet.
# Health exposes status only (never details) so anonymous health checks
# cannot leak environment detail; metrics require TWIN_READ.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics travel via the Prometheus scrape endpoint only (no OTLP metrics push).
management.otlp.metrics.export.enabled=false
# Phase 3B-2: logs ALSO ship over OTLP/HTTP to the collector, which forwards
# them to Loki. Console output is unchanged (see logging.pattern.level).
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- Phase 4: repository connector (twin observation) ---
# Filesystem root of the target-service repository the connector reads
# (read-only; it never writes there). Default: <working-dir>/target-services
# when running from backend/, <working-dir>/backend/target-services when
# running from the repository root. Override per machine via the environment
# (relaxed binding for systivex.observation.repository-root):
#   $env:SYSTIVEX_OBSERVATION_REPOSITORY_ROOT="C:\path\to\target-services"
# or per call with {"repositoryRoot": "..."} in POST /api/v1/twin/sync.
#systivex.observation.repository-root=
# --- Phase 10: control-plane authentication and authorization ---
# OAuth2 resource server with JWT bearer tokens (stateless, no sessions).
# issuer-uri is mandatory and fail-closed: the application will not start
# without it, and setting enabled=false is rejected (no security-off mode).
# jwk-set-uri is optional and only overrides key discovery; issuer, audience,
# signature, expiry, and nbf are always validated. Role mapping is
# allowlist-only via the roles claim; TWIN_ADMIN inherits READ/ANALYZE/OPERATOR.
# Endpoint policy: twin/impact/risk GETs need TWIN_READ; twin POSTs need
# TWIN_ADMIN; simulations/policy-evaluations need TWIN_ANALYZE; sync and
# observations need TWIN_OPERATOR plus the loopback guard; health is anonymous
# (status only); prometheus needs TWIN_READ; everything else is denied.
# Configure the issuer per machine via the environment (never commit secrets):
#   $env:SYSTIVEX_ISSUER_URI="https://<trusted-issuer>"
# Local, non-SSL issuers are valid only in isolated development environments.
systivex.security.jwt.enabled=true
systivex.security.jwt.issuer-uri=${SYSTIVEX_ISSUER_URI:}
systivex.security.jwt.jwk-set-uri=${SYSTIVEX_JWK_SET_URI:}
systivex.security.jwt.accepted-audience=systivex
systivex.security.jwt.role-claim=roles
systivex.security.jwt.clock-skew-seconds=60
systivex.security.jwt.allowed-roles=TWIN_READ,TWIN_ANALYZE,TWIN_OPERATOR,TWIN_ADMIN,TWIN_APPROVER
